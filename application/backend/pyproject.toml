[project]
name = "backend"
version = "0.1.0"
description = "Core application logic, API endpoints"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["fastapi[standard]>=0.162.4"]

[tool.fastapi]
entrypoint = "backend.main:app"


[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["httpx>=0.28.1", "pytest>=9.2.0", "ruff>=0.17.4"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
extend-select = ["I"]
